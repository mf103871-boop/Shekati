name: ShekatiSchemaBootstrap
options:
  minimumXcodeGenVersion: "2.42.0"
  projectFormat: xcode16_0
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
configs:
  Debug: debug
packages:
  ShekatiCore:
    path: ../../Packages/ShekatiCore
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SHEKATI_ICLOUD_CONTAINER: iCloud.com.mf103871.shekati
    SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DEBUG SHEKATI_SCHEMA_BOOTSTRAP"
targets:
  ShekatiSchemaBootstrap:
    type: application
    platform: iOS
    sources:
      - path: Sources
      # The model is compiled directly from the production source, never copied.
      - path: ../../Shekati/Models/ChequeRecord.swift
      - path: ../../Shekati/Resources/Assets.xcassets
    dependencies:
      - package: ShekatiCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mf103871.shekati
        PRODUCT_NAME: ShekatiSchemaBootstrap
        INFOPLIST_FILE: Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Resources/SchemaBootstrap.entitlements
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
schemes:
  ShekatiSchemaBootstrap:
    build:
      targets:
        ShekatiSchemaBootstrap: all
    run:
      config: Debug
    archive:
      config: Debug
    management:
      shared: true
