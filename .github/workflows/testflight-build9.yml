name: Upload verified Shekati build 9
# One-time upload requires successful native source CI run 37668037449.
# Signing identities and build number are fixed to prevent input-copy mistakes.
on:
  push:
    branches: [main]
    paths: [.github/workflows/testflight-build9.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: testflight-upload
  cancel-in-progress: false
jobs:
  upload:
    runs-on: macos-26
    timeout-minutes: 60
    environment: testflight
    env:
      APP_BUNDLE_ID: com.mf103871.shekati
      CLOUD_CONTAINER_ID: iCloud.com.mf103871.shekati
      APPLE_TEAM_ID: 96WJBK2MB2
      APP_BUILD_NUMBER: "9"
      CERTIFICATE_BASE64: ${{ secrets.DISTRIBUTION_CERTIFICATE_BASE64 }}
      CERTIFICATE_PASSWORD: ${{ secrets.DISTRIBUTION_CERTIFICATE_PASSWORD }}
      PROFILE_BASE64: ${{ secrets.APPSTORE_PROVISIONING_PROFILE_BASE64 }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 7664b5d89d4212bb46b6a92ebeaca5b31cc2b5d0
      - name: Verify successful tests for the exact app source
        env:
          VALIDATION_READ_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess, urllib.request
          expected = '7664b5d89d4212bb46b6a92ebeaca5b31cc2b5d0'
          if subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() != expected:
              raise SystemExit('Checkout does not match the validated app source')
          base = 'https://api.github.com/repos/mf103871-boop/Shekati/actions/runs/37668037449'
          def read(url):
              request = urllib.request.Request(url, headers={
                  'Authorization': 'Bearer ' + os.environ['VALIDATION_READ_TOKEN'],
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28'})
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)
          if os.environ['GITHUB_EVENT_NAME'] == 'push':
              publication = read('https://api.github.com/repos/mf103871-boop/Shekati/commits/' + os.environ['GITHUB_SHA'])
              parents = publication.get('parents', [])
              files = publication.get('files', [])
              if len(parents) != 1 or parents[0].get('sha') != expected or len(files) != 1 or files[0].get('filename') != '.github/workflows/testflight-build9.yml' or files[0].get('status') != 'added':
                  raise SystemExit('Automatic upload is limited to the initial workflow-only publication')
          run = read(base)
          if run.get('status') != 'completed' or run.get('conclusion') != 'success' or run.get('head_branch') != 'main' or run.get('head_sha') != expected or run.get('event') != 'push' or run.get('path') != '.github/workflows/ci.yml' or run.get('repository', {}).get('full_name') != 'mf103871-boop/Shekati':
              raise SystemExit('Validation provenance does not match the approved app source')
          jobs = read(base + '/jobs?filter=latest&per_page=100')
          matches = [job for job in jobs.get('jobs', []) if job.get('id') == 112953540885 and job.get('name') == 'test']
          if len(matches) != 1 or matches[0].get('status') != 'completed' or matches[0].get('conclusion') != 'success':
              raise SystemExit('The exact source has no verified successful native validation job')
          print('Confirmed successful native validation for source ' + expected)
          PY
      - name: Check supported upload toolchain
        run: |
          xcodebuild -version
          python3 - <<'PY'
          import re, subprocess
          version = subprocess.check_output(['xcodebuild', '-version'], text=True)
          match = re.search(r'Xcode (\d+)', version)
          if not match or int(match.group(1)) < 26:
              raise SystemExit('App Store iOS uploads require Xcode 26 or newer; select a supported runner Xcode.')
          PY
      - name: Check setup and stage signing files
        run: |
          python3 - <<'PY'
          import base64, os, pathlib, re
          required = ['APP_BUNDLE_ID', 'CLOUD_CONTAINER_ID', 'APPLE_TEAM_ID', 'APP_BUILD_NUMBER', 'CERTIFICATE_BASE64', 'CERTIFICATE_PASSWORD', 'PROFILE_BASE64', 'KEYCHAIN_PASSWORD', 'ASC_KEY_ID', 'ASC_ISSUER_ID', 'ASC_KEY_BASE64']
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              raise SystemExit('Missing setup values: ' + ', '.join(missing))
          if not re.fullmatch(r'[A-Za-z0-9-]+(?:\.[A-Za-z0-9-]+)+', os.environ['APP_BUNDLE_ID']):
              raise SystemExit('Invalid Bundle ID')
          if os.environ['APP_BUNDLE_ID'] == 'com.shekati.app':
              raise SystemExit('Replace the sample Bundle ID with one registered to your account')
          if not re.fullmatch(r'iCloud\.[A-Za-z0-9.-]+', os.environ['CLOUD_CONTAINER_ID']):
              raise SystemExit('Invalid CloudKit container identifier')
          if not re.fullmatch(r'[A-Z0-9]{10}', os.environ['APPLE_TEAM_ID']):
              raise SystemExit('Invalid Team ID')
          if not re.fullmatch(r'[1-9][0-9]*', os.environ['APP_BUILD_NUMBER']):
              raise SystemExit('Build number must be a positive integer')
          if not re.fullmatch(r'[A-Z0-9]+', os.environ['ASC_KEY_ID']):
              raise SystemExit('Invalid App Store Connect API Key ID')
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          for env, filename in [('CERTIFICATE_BASE64', 'certificate.p12'), ('PROFILE_BASE64', 'profile.mobileprovision')]:
              path = root / filename
              path.write_bytes(base64.b64decode(os.environ[env], validate=True))
              path.chmod(0o600)
          key_dir = pathlib.Path.home() / 'private_keys'
          key_dir.mkdir(mode=0o700, exist_ok=True)
          key_path = key_dir / ('AuthKey_' + os.environ['ASC_KEY_ID'] + '.p8')
          key_path.write_bytes(base64.b64decode(os.environ['ASC_KEY_BASE64'], validate=True))
          key_path.chmod(0o600)
          PY
      - name: Install distribution credentials
        run: |
          SIGNING_KEYCHAIN="$RUNNER_TEMP/shekati-signing.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$SIGNING_KEYCHAIN"
          security set-keychain-settings -lut 3600 "$SIGNING_KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$SIGNING_KEYCHAIN"
          security import "$RUNNER_TEMP/certificate.p12" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$SIGNING_KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$SIGNING_KEYCHAIN"
          security list-keychains -d user -s "$SIGNING_KEYCHAIN"
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          python3 - <<'PY'
          import os, pathlib, plistlib, shutil
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          profile = plistlib.loads((root / 'profile.plist').read_bytes())
          team = os.environ['APPLE_TEAM_ID']
          bundle = os.environ['APP_BUNDLE_ID']
          entitlements = profile['Entitlements']
          if profile.get('TeamIdentifier', [None])[0] != team or not entitlements.get('application-identifier', '').endswith('.' + bundle):
              raise SystemExit('Provisioning profile does not match Team ID and Bundle ID')
          if entitlements.get('get-task-allow') or profile.get('ProvisionedDevices') or profile.get('ProvisionsAllDevices'):
              raise SystemExit('Use an App Store distribution profile')
          if os.environ['CLOUD_CONTAINER_ID'] not in entitlements.get('com.apple.developer.icloud-container-identifiers', []):
              raise SystemExit('Provisioning profile does not enable the requested iCloud container')
          destination = pathlib.Path.home() / 'Library/MobileDevice/Provisioning Profiles'
          destination.mkdir(parents=True, exist_ok=True)
          shutil.copyfile(root / 'profile.mobileprovision', destination / (profile['UUID'] + '.mobileprovision'))
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('PROFILE_UUID=' + profile['UUID'] + '\n')
          export = {'method': 'app-store-connect', 'destination': 'export', 'signingStyle': 'manual', 'teamID': team, 'provisioningProfiles': {bundle: profile['UUID']}, 'stripSwiftSymbols': True, 'manageAppVersionAndBuildNumber': False, 'iCloudContainerEnvironment': 'Production'}
          (root / 'ExportOptions.plist').write_bytes(plistlib.dumps(export))
          PY
      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Archive signed iPhone app
        run: |
          xcodebuild archive -project Shekati.xcodeproj -scheme Shekati \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Shekati.xcarchive" \
            PRODUCT_BUNDLE_IDENTIFIER="$APP_BUNDLE_ID" \
            SHEKATI_ICLOUD_CONTAINER="$CLOUD_CONTAINER_ID" \
            CURRENT_PROJECT_VERSION="$APP_BUILD_NUMBER" DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY='Apple Distribution' \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID"
      - name: Verify archive targets iPhone only
        run: |
          python3 - <<'PY'
          import os, pathlib, plistlib
          info_path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'Shekati.xcarchive/Products/Applications/Shekati.app/Info.plist'
          families = plistlib.loads(info_path.read_bytes()).get('UIDeviceFamily')
          if families != [1]:
              raise SystemExit(f'Refusing to export an archive with UIDeviceFamily={families!r}; expected iPhone only [1]')
          PY
      - name: Export signed iPhone app
        run: |
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Shekati.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/Shekati-export"
      - name: Verify exported IPA targets iPhone only
        run: |
          python3 - <<'PY'
          import os, pathlib, plistlib, re, zipfile
          ipa_path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'Shekati-export/Shekati.ipa'
          with zipfile.ZipFile(ipa_path) as ipa:
              info_paths = [name for name in ipa.namelist() if re.fullmatch(r'Payload/[^/]+\.app/Info\.plist', name)]
              if len(info_paths) != 1:
                  raise SystemExit('Expected exactly one exported iPhone app')
              families = plistlib.loads(ipa.read(info_paths[0])).get('UIDeviceFamily')
          if families != [1]:
              raise SystemExit(f'Refusing to upload an IPA with UIDeviceFamily={families!r}; expected iPhone only [1]')
          PY
      - name: Upload for TestFlight processing
        run: |
          xcrun altool --upload-app --type ios --file "$RUNNER_TEMP/Shekati-export/Shekati.ipa" \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
      - name: Remove signing credentials
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/shekati-signing.keychain-db" || true
          python3 - <<'PY'
          import os, pathlib
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          for name in ['certificate.p12', 'profile.mobileprovision', 'profile.plist', 'ExportOptions.plist']:
              (root / name).unlink(missing_ok=True)
          if os.environ.get('ASC_KEY_ID'):
              (pathlib.Path.home() / 'private_keys' / ('AuthKey_' + os.environ['ASC_KEY_ID'] + '.p8')).unlink(missing_ok=True)
          if os.environ.get('PROFILE_UUID'):
              (pathlib.Path.home() / 'Library/MobileDevice/Provisioning Profiles' / (os.environ['PROFILE_UUID'] + '.mobileprovision')).unlink(missing_ok=True)
          PY
