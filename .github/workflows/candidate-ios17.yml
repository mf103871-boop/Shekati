name: Candidate 17 on iOS 17.5
on:
  push:
    branches: [qa/build17-ios17-compatibility]
permissions:
  contents: read
jobs:
  compile:
    runs-on: macos-26
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9fca85268c9a4bde4b563c7447bff062b793b0fc
          persist-credentials: false
      - name: Compile unchanged simulator products with the release compiler
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 9fca85268c9a4bde4b563c7447bff062b793b0fc
          xcodebuild -version
          if ! command -v xcodegen >/dev/null; then brew install xcodegen; fi
          xcodegen generate
          xcodebuild build-for-testing -project Shekati.xcodeproj -scheme Shekati -configuration Debug -destination "generic/platform=iOS Simulator" -derivedDataPath DerivedData ONLY_ACTIVE_ARCH=NO ARCHS=arm64 CODE_SIGNING_ALLOWED=NO > "$RUNNER_TEMP/build.log" 2>&1 || { grep -E 'error:|failed:' "$RUNNER_TEMP/build.log" | head -60; exit 1; }
          cd DerivedData/Build
          COPYFILE_DISABLE=1 tar -czf ../../RuntimeProducts.tgz Products
          cd ../..
          shasum -a 256 RuntimeProducts.tgz > RuntimeProducts.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: Candidate-17-simulator-products
          path: |
            RuntimeProducts.tgz
            RuntimeProducts.sha256
          retention-days: 3
          compression-level: 0
  compatibility:
    needs: compile
    runs-on: macos-15
    timeout-minutes: 38
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9fca85268c9a4bde4b563c7447bff062b793b0fc
          persist-credentials: false
      - name: Identify host and exact candidate source
        run: |
          test "$(git rev-parse HEAD)" = 9fca85268c9a4bde4b563c7447bff062b793b0fc
          sw_vers
          uname -m
          xcodebuild -version
          xcrun simctl list runtimes
          df -h /
      - name: Acquire Apple iOS 17.5 simulator
        timeout-minutes: 16
        run: |
          set -euo pipefail
          if ! xcrun simctl list runtimes | grep -Eq '^iOS 17\.5 .*21F79.*iOS-17-5$'; then
            xcodebuild -downloadPlatform iOS -buildVersion 17.5 > "$RUNNER_TEMP/download.log" 2>&1 || { tail -15 "$RUNNER_TEMP/download.log"; exit 1; }
          fi
          xcrun simctl list runtimes
          xcrun simctl list runtimes | grep -E '^iOS 17\.5 .*21F79.*iOS-17-5$'
      - name: Boot test iPhone and record its runtime
        run: |
          set -euo pipefail
          device="$(xcrun simctl create Shekati-Minimum-iOS17 com.apple.CoreSimulator.SimDeviceType.iPhone-15 com.apple.CoreSimulator.SimRuntime.iOS-17-5)"
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device" -b
          xcrun simctl list devices booted
          echo "DEVICE=$device" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: Candidate-17-simulator-products
      - name: Install exact simulator products and launch Shekati 1.0.0 (17)
        run: |
          set -euo pipefail
          shasum -a 256 -c RuntimeProducts.sha256
          tar -xzf RuntimeProducts.tgz
          app=Products/Debug-iphonesimulator/Shekati.app
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app/Info.plist")" = 17
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Info.plist")" = 1.0.0
          xcrun simctl install "$DEVICE" "$app"
          xcrun simctl launch "$DEVICE" com.mf103871.shekati
          sleep 8
          xcrun simctl io "$DEVICE" screenshot candidate-ios17-launch.png
          xcrun simctl terminate "$DEVICE" com.mf103871.shekati
      - name: Enter a cheque, deposit, collect and open its calendar entry
        timeout-minutes: 9
        run: |
          manifests=(Products/*.xctestrun)
          test "${#manifests[@]}" -eq 1
          xcodebuild test-without-building -xctestrun "${manifests[0]}" -destination "platform=iOS Simulator,id=$DEVICE" -parallel-testing-enabled NO -resultBundlePath Runtime17.xcresult -only-testing:ShekatiUITests/EnhancementUITests/testIncomingDepositAndCollectionMoveTheBankBalanceOnceAndRemainInCalendar
      - name: Record QA result
        if: always()
        run: |
          if [ -d Runtime17.xcresult ]; then
            xcrun xcresulttool get test-results summary --path Runtime17.xcresult > summary-ios17.json
            cat summary-ios17.json
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Candidate-17-on-iOS17
          path: |
            summary-ios17.json
            Runtime17.xcresult
            candidate-ios17-launch.png
          if-no-files-found: ignore
          retention-days: 7
