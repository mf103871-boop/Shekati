name: Candidate 17 on iOS 17.5
on:
  push:
    branches: [qa/build17-ios17-compatibility]
permissions:
  contents: read
  actions: read
jobs:
  compatibility:
    runs-on: macos-15
    timeout-minutes: 38
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9fca85268c9a4bde4b563c7447bff062b793b0fc
          persist-credentials: false
      - name: Identify host and exact candidate source
        run: |
          test "$(git rev-parse HEAD)" = 9fca85268c9a4bde4b563c7447bff062b793b0fc
          sw_vers
          uname -m
          xcodebuild -version
          xcrun simctl list runtimes
          df -h /
      - name: Acquire Apple iOS 17.5 simulator
        timeout-minutes: 16
        run: |
          set -euo pipefail
          if ! xcrun simctl list runtimes | grep -Eq '^iOS 17\.5 .*21F79.*iOS-17-5$'; then
            xcodebuild -downloadPlatform iOS -buildVersion 17.5 > "$RUNNER_TEMP/download.log" 2>&1 || { tail -15 "$RUNNER_TEMP/download.log"; exit 1; }
          fi
          xcrun simctl list runtimes
          xcrun simctl list runtimes | grep -E '^iOS 17\.5 .*21F79.*iOS-17-5$'
      - name: Boot test iPhone and record its runtime
        run: |
          set -euo pipefail
          device="$(xcrun simctl create Shekati-Minimum-iOS17 com.apple.CoreSimulator.SimDeviceType.iPhone-15 com.apple.CoreSimulator.SimRuntime.iOS-17-5)"
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device" -b
          xcrun simctl list devices booted
          echo "DEVICE=$device" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: Candidate-17-simulator-products
          run-id: 44889062779
          github-token: ${{ github.token }}
      - name: Verify exact products before XCTest installs and launches the candidate
        run: |
          set -euo pipefail
          shasum -a 256 -c RuntimeProducts.sha256
          tar -xzf RuntimeProducts.tgz
          app=Products/Debug-iphonesimulator/Shekati.app
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app/Info.plist")" = 17
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Info.plist")" = 1.0.0
          shasum -a 256 "$app/Shekati"
          xcrun simctl spawn "$DEVICE" launchctl print system/com.apple.SpringBoard >/dev/null || xcrun simctl bootstatus "$DEVICE" -b
      - name: Enter a cheque, deposit, collect and open its calendar entry
        timeout-minutes: 9
        run: |
          manifests=(Products/*.xctestrun)
          test "${#manifests[@]}" -eq 1
          run_probe() {
            xcodebuild test-without-building -xctestrun "${manifests[0]}" -destination "platform=iOS Simulator,id=$DEVICE" -parallel-testing-enabled NO -resultBundlePath "$1" -only-testing:ShekatiUITests/EnhancementUITests/testIncomingDepositAndCollectionMoveTheBankBalanceOnceAndRemainInCalendar
          }
          set -o pipefail
          if ! run_probe Runtime17.xcresult 2>&1 | tee "$RUNNER_TEMP/first-test.log"; then
            if grep -q 'is installing or uninstalling, and cannot be launched' "$RUNNER_TEMP/first-test.log" && ! grep -q 'Tap "chooseCurrency"' "$RUNNER_TEMP/first-test.log"; then
              mv Runtime17.xcresult InstallBusy.xcresult
              xcrun simctl bootstatus "$DEVICE" -b
              sleep 10
              run_probe Runtime17.xcresult
            else
              exit 1
            fi
          fi
      - name: Record QA result
        if: always()
        run: |
          if [ -d Runtime17.xcresult ]; then
            xcrun xcresulttool get test-results summary --path Runtime17.xcresult > summary-ios17.json
            cat summary-ios17.json
            xcrun xcresulttool export attachments --path Runtime17.xcresult --output-path ProbeAttachments
          fi
          if [ -n "${DEVICE:-}" ]; then
            data="$(xcrun simctl get_app_container "$DEVICE" com.mf103871.shekati data)"
            export QA_STORE="$data/Library/Application Support/Shekati/Shekati.store"
            python3 - <<'PY'
          import json, os, pathlib, sqlite3
          p=pathlib.Path(os.environ['QA_STORE'])
          db=sqlite3.connect(p.as_uri()+'?mode=ro', uri=True)
          receipt={}
          receipt['cheques']=db.execute('SELECT ZNUMBER,ZCURRENCYCODE,ZAMOUNTMINORUNITS,ZSTATUSRAW FROM ZCHEQUERECORD').fetchall()
          receipt['events']=db.execute('SELECT ZKINDRAW,ZAMOUNTMINOR,ZCURRENCYCODE FROM ZLEDGEREVENTRECORD ORDER BY Z_PK').fetchall()
          receipt['accounts']=db.execute('SELECT ZNAME,ZCURRENCYCODE,ZOPENINGMINOR FROM ZBANKACCOUNTRECORD').fetchall()
          pathlib.Path('persisted-ios17.json').write_text(json.dumps(receipt,indent=2))
          print(receipt)
          PY
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Candidate-17-on-iOS17
          path: |
            summary-ios17.json
            Runtime17.xcresult
            candidate-ios17-launch.png
            persisted-ios17.json
            ProbeAttachments
          if-no-files-found: ignore
          retention-days: 7
