name: Prepare CloudKit schema setup app
on:
  workflow_dispatch:
    inputs:
      signing:
        description: Export a signed setup IPA for already registered iPhones
        type: boolean
        default: false
      bundle_id:
        description: Account-owned Bundle ID (required for signed export)
        type: string
        required: false
      cloud_container_id:
        description: Account-owned CloudKit container (required for signed export)
        type: string
        required: false
      development_team:
        description: Apple Developer Team ID (required for signed export)
        type: string
        required: false
      build_number:
        description: Positive integer build number
        type: string
        default: "1"
permissions:
  contents: read
concurrency:
  group: schema-bootstrap
  cancel-in-progress: false
jobs:
  validate:
    uses: ./.github/workflows/ci.yml
  prepare:
    needs: validate
    runs-on: macos-26
    timeout-minutes: 45
    environment: testflight
    env:
      APP_BUNDLE_ID: ${{ inputs.bundle_id }}
      CLOUD_CONTAINER_ID: ${{ inputs.cloud_container_id }}
      APPLE_TEAM_ID: ${{ inputs.development_team }}
      APP_BUILD_NUMBER: ${{ inputs.build_number }}
      CERTIFICATE_BASE64: ${{ secrets.DISTRIBUTION_CERTIFICATE_BASE64 }}
      CERTIFICATE_PASSWORD: ${{ secrets.DISTRIBUTION_CERTIFICATE_PASSWORD }}
      PROFILE_BASE64: ${{ secrets.ADHOC_PROVISIONING_PROFILE_BASE64 }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Generate separate setup project
        run: |
          xcodebuild -version
          brew install xcodegen
          xcodegen generate --spec Tools/SchemaBootstrap/project.yml --project Tools/SchemaBootstrap
      - name: Compile setup app without signing
        run: |
          xcodebuild build -project Tools/SchemaBootstrap/ShekatiSchemaBootstrap.xcodeproj \
            -scheme ShekatiSchemaBootstrap -configuration Debug -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/SchemaBootstrap-derived" CODE_SIGNING_ALLOWED=NO
      - name: Stage requested signing files
        if: ${{ inputs.signing }}
        run: |
          python3 - <<'PY'
          import base64, os, pathlib, re
          required = ['APP_BUNDLE_ID', 'CLOUD_CONTAINER_ID', 'APPLE_TEAM_ID', 'APP_BUILD_NUMBER', 'CERTIFICATE_BASE64', 'CERTIFICATE_PASSWORD', 'PROFILE_BASE64', 'KEYCHAIN_PASSWORD']
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              raise SystemExit('Missing signed-export setup values: ' + ', '.join(missing))
          if not re.fullmatch(r'[A-Za-z0-9-]+(?:\.[A-Za-z0-9-]+)+', os.environ['APP_BUNDLE_ID']) or os.environ['APP_BUNDLE_ID'] == 'com.shekati.app':
              raise SystemExit('Use a valid, account-owned Bundle ID')
          if not re.fullmatch(r'iCloud\.[A-Za-z0-9.-]+', os.environ['CLOUD_CONTAINER_ID']):
              raise SystemExit('Invalid CloudKit container identifier')
          if not re.fullmatch(r'[A-Z0-9]{10}', os.environ['APPLE_TEAM_ID']):
              raise SystemExit('Invalid Team ID')
          if not re.fullmatch(r'[1-9][0-9]*', os.environ['APP_BUILD_NUMBER']):
              raise SystemExit('Build number must be a positive integer')
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          for env, filename in [('CERTIFICATE_BASE64', 'schema-certificate.p12'), ('PROFILE_BASE64', 'schema-profile.mobileprovision')]:
              path = root / filename
              path.write_bytes(base64.b64decode(os.environ[env], validate=True))
              path.chmod(0o600)
          PY
      - name: Install ad-hoc signing credentials
        if: ${{ inputs.signing }}
        run: |
          SIGNING_KEYCHAIN="$RUNNER_TEMP/schema-signing.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$SIGNING_KEYCHAIN"
          security set-keychain-settings -lut 3600 "$SIGNING_KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$SIGNING_KEYCHAIN"
          security import "$RUNNER_TEMP/schema-certificate.p12" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$SIGNING_KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$SIGNING_KEYCHAIN"
          security list-keychains -d user -s "$SIGNING_KEYCHAIN"
          security cms -D -i "$RUNNER_TEMP/schema-profile.mobileprovision" > "$RUNNER_TEMP/schema-profile.plist"
          python3 - <<'PY'
          import datetime, os, pathlib, plistlib, shutil
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          profile = plistlib.loads((root / 'schema-profile.plist').read_bytes())
          team, bundle, cloud = (os.environ[name] for name in ['APPLE_TEAM_ID', 'APP_BUNDLE_ID', 'CLOUD_CONTAINER_ID'])
          entitlements = profile['Entitlements']
          if profile.get('TeamIdentifier', [None])[0] != team or not entitlements.get('application-identifier', '').endswith('.' + bundle):
              raise SystemExit('Profile does not match the Team ID and Bundle ID')
          if not profile.get('ProvisionedDevices') or entitlements.get('get-task-allow') or profile.get('ProvisionsAllDevices'):
              raise SystemExit('Use an ad-hoc distribution profile containing the intended registered iPhone')
          expiration = profile.get('ExpirationDate')
          if not expiration or expiration.replace(tzinfo=datetime.timezone.utc) <= datetime.datetime.now(datetime.timezone.utc):
              raise SystemExit('Provisioning profile has expired')
          if cloud not in entitlements.get('com.apple.developer.icloud-container-identifiers', []):
              raise SystemExit('Profile does not enable the requested CloudKit container')
          services = entitlements.get('com.apple.developer.icloud-services', [])
          # Apple profiles can authorize all iCloud services with a wildcard string.
          if services not in ('*', 'CloudKit') and not (isinstance(services, list) and ('CloudKit' in services or '*' in services)):
              raise SystemExit('Profile does not enable CloudKit')
          if entitlements.get('aps-environment') != 'production':
              raise SystemExit('Ad-hoc profile must enable production push notifications')
          destination = pathlib.Path.home() / 'Library/MobileDevice/Provisioning Profiles'
          destination.mkdir(parents=True, exist_ok=True)
          shutil.copyfile(root / 'schema-profile.mobileprovision', destination / (profile['UUID'] + '.mobileprovision'))
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('SCHEMA_PROFILE_UUID=' + profile['UUID'] + '\n')
          export = {'method': 'release-testing', 'destination': 'export', 'signingStyle': 'manual', 'teamID': team, 'provisioningProfiles': {bundle: profile['UUID']}, 'signingCertificate': 'Apple Distribution', 'manageAppVersionAndBuildNumber': False, 'iCloudContainerEnvironment': 'Development', 'thinning': '<none>', 'stripSwiftSymbols': True}
          (root / 'SchemaExportOptions.plist').write_bytes(plistlib.dumps(export))
          PY
      - name: Archive and export the dedicated development-cloud app
        if: ${{ inputs.signing }}
        run: |
          xcodebuild archive -project Tools/SchemaBootstrap/ShekatiSchemaBootstrap.xcodeproj \
            -scheme ShekatiSchemaBootstrap -configuration Debug -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/ShekatiSchemaBootstrap.xcarchive" \
            PRODUCT_BUNDLE_IDENTIFIER="$APP_BUNDLE_ID" SHEKATI_ICLOUD_CONTAINER="$CLOUD_CONTAINER_ID" \
            CURRENT_PROJECT_VERSION="$APP_BUILD_NUMBER" DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY='Apple Distribution' PROVISIONING_PROFILE_SPECIFIER="$SCHEMA_PROFILE_UUID"
          python3 - <<'PY'
          import os, pathlib, plistlib
          info_path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'ShekatiSchemaBootstrap.xcarchive/Products/Applications/ShekatiSchemaBootstrap.app/Info.plist'
          families = plistlib.loads(info_path.read_bytes()).get('UIDeviceFamily')
          if families != [1]:
              raise SystemExit(f'Refusing to export a setup archive with UIDeviceFamily={families!r}; expected iPhone only [1]')
          PY
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/ShekatiSchemaBootstrap.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/SchemaExportOptions.plist" -exportPath "$RUNNER_TEMP/Schema-export"
      - name: Verify exported app uses the development CloudKit environment
        if: ${{ inputs.signing }}
        run: |
          python3 - <<'PY'
          import os, pathlib, plistlib, subprocess, zipfile
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          with zipfile.ZipFile(root / 'Schema-export/ShekatiSchemaBootstrap.ipa') as archive:
              archive.extractall(root / 'Schema-verify')
          apps = list((root / 'Schema-verify/Payload').glob('*.app'))
          if len(apps) != 1:
              raise SystemExit('Expected exactly one setup app')
          app = apps[0]
          subprocess.run(['codesign', '--verify', '--deep', '--strict', str(app)], check=True)
          entitlements = plistlib.loads(subprocess.check_output(['codesign', '-d', '--entitlements', ':-', str(app)], stderr=subprocess.DEVNULL))
          if entitlements.get('com.apple.developer.icloud-container-environment') != 'Development':
              raise SystemExit('Refusing to deliver a schema initializer signed for Production')
          if os.environ['CLOUD_CONTAINER_ID'] not in entitlements.get('com.apple.developer.icloud-container-identifiers', []):
              raise SystemExit('Exported app uses a different CloudKit container')
          if 'CloudKit' not in entitlements.get('com.apple.developer.icloud-services', []):
              raise SystemExit('Exported app does not request CloudKit')
          if entitlements.get('aps-environment') != 'production':
              raise SystemExit('Exported ad-hoc app uses the wrong push notification environment')
          info = plistlib.loads((app / 'Info.plist').read_bytes())
          if info.get('UIDeviceFamily') != [1]:
              raise SystemExit(f'Refusing to deliver a setup IPA with UIDeviceFamily={info.get("UIDeviceFamily")!r}; expected iPhone only [1]')
          if info['CFBundleIdentifier'] != os.environ['APP_BUNDLE_ID'] or info.get('ShekatiCloudContainerIdentifier') != os.environ['CLOUD_CONTAINER_ID']:
              raise SystemExit('Exported app metadata does not match the requested setup')
          PY
      - name: Save setup IPA for private download
        if: ${{ inputs.signing }}
        uses: actions/upload-artifact@v4
        with:
          name: ShekatiSchemaBootstrap-registered-iPhone
          path: ${{ runner.temp }}/Schema-export/ShekatiSchemaBootstrap.ipa
          if-no-files-found: error
          retention-days: 3
      - name: Remove signing credentials
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/schema-signing.keychain-db" || true
          python3 - <<'PY'
          import os, pathlib
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          for name in ['schema-certificate.p12', 'schema-profile.mobileprovision', 'schema-profile.plist', 'SchemaExportOptions.plist']:
              (root / name).unlink(missing_ok=True)
          if os.environ.get('SCHEMA_PROFILE_UUID'):
              (pathlib.Path.home() / 'Library/MobileDevice/Provisioning Profiles' / (os.environ['SCHEMA_PROFILE_UUID'] + '.mobileprovision')).unlink(missing_ok=True)
          PY
