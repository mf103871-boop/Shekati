name: Capture build 15 signed balance on compact iPhone
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: screen-layout-${{ github.ref }}
  cancel-in-progress: true
jobs:
  layout:
    name: Native layout (${{ matrix.size }})
    runs-on: macos-26
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        size: [small]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Show source and build tools
        run: |
          git rev-parse HEAD
          xcodebuild -version
      - name: Install project generator
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Create native iPhone simulator
        id: simulator
        env:
          SCREEN_SIZE: ${{ matrix.size }}
        run: python3 Tools/ScreenAudit/select_simulator.py
      - name: Prepare simulator
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool false
          xcrun simctl boot "$SIMULATOR_UDID"
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b
          xcrun simctl ui "$SIMULATOR_UDID" appearance light
          xcrun simctl status_bar "$SIMULATOR_UDID" override --time '9:41' --dataNetwork wifi --wifiMode active --wifiBars 3 --batteryState charged --batteryLevel 100
      - name: Build identically sourced app and QA tests
        env:
          DEST: ${{ steps.simulator.outputs.destination }}
        run: |
          xcodebuild build-for-testing -quiet -project Shekati.xcodeproj -scheme Shekati -destination "$DEST" -derivedDataPath DerivedData CODE_SIGNING_ALLOWED=NO
      - name: Inspect the actual signed balance in light and dark
        env:
          DEST: ${{ steps.simulator.outputs.destination }}
          UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          set -o pipefail
          mkdir -p build/balance
          cp build/capture-device.json build/balance/device.json
          git rev-parse HEAD > build/balance/source.txt
          failures=0
          for mode in light dark; do
            mkdir -p "build/balance/$mode"
            xcrun simctl ui "$UDID" appearance "$mode"
            xcrun simctl ui "$UDID" appearance > "build/balance/$mode/appearance.txt"
            if ! xcodebuild test-without-building -project Shekati.xcodeproj -scheme Shekati -destination "$DEST" -derivedDataPath DerivedData -only-testing:ShekatiUITests/ResponsiveLayoutUITests -parallel-testing-enabled NO -maximum-concurrent-test-simulator-destinations 1 -resultBundlePath "build/$mode.xcresult" CODE_SIGNING_ALLOWED=NO > "build/balance/$mode/log.txt" 2>&1; then
              failures=1
            fi
            xcrun xcresulttool export attachments --path "build/$mode.xcresult" --output-path "build/balance/$mode/attachments"
            xcrun xcresulttool get test-results summary --path "build/$mode.xcresult" > "build/balance/$mode/summary.json"
          done
          exit "$failures"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build15-compact-signed-balance
          path: build/balance
          if-no-files-found: error
          retention-days: 14
