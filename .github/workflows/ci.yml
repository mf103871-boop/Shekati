name: Build and test iPhone app
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: capture
            artifactSuffix: '-capture'
    runs-on: macos-26
    timeout-minutes: 105
    steps:
      - uses: actions/checkout@v4
      - name: Validate app and store localizations
        if: matrix.shard == 'general'
        run: python3 Tools/Localization/audit_release.py
      - name: Show build tools
        run: |
          xcodebuild -version
          swift --version
      - name: Validate core behavior on macOS
        if: matrix.shard == 'general'
        run: swift test --package-path Packages/ShekatiCore
      - name: Install project generator
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Validate schema bootstrap build
        if: matrix.shard == 'general'
        run: |
          xcodegen generate --spec Tools/SchemaBootstrap/project.yml --project Tools/SchemaBootstrap
          xcodebuild build -project Tools/SchemaBootstrap/ShekatiSchemaBootstrap.xcodeproj \
            -scheme ShekatiSchemaBootstrap -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/SchemaBootstrap-derived" \
            CODE_SIGNING_ALLOWED=NO
      - name: Choose an available iPhone simulator
        id: simulator
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          devices = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', 'devices', 'available', '-j']))['devices']
          candidates = [(runtime, d) for runtime, values in devices.items() if '.iOS-' in runtime for d in values if d.get('isAvailable') and d['name'].startswith('iPhone')]
          if not candidates:
              raise SystemExit('No available iPhone simulator. Install an iOS simulator runtime on the runner.')
          # StoreKitTest on iOS 26.5 reports SKInternalErrorDomain 3 when a CLI
          # session loads its catalog (FB22237318). Layout CI covers the latest runtime.
          runtime, device = next(pair for pair in candidates if pair[0].endswith('iOS-26-2') and pair[1]['name'] == 'iPhone Air')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f"destination=platform=iOS Simulator,id={device['udid']}\n")
          print('Selected', device['name'], runtime)
          PY
      - name: Compile app and tests
        id: compile
        env:
          DEST: ${{ steps.simulator.outputs.destination }}
        run: xcodebuild build-for-testing -project Shekati.xcodeproj -scheme Shekati -destination "$DEST" -derivedDataPath DerivedData CODE_SIGNING_ALLOWED=NO
      - name: Exercise finance, migration, reminders and StoreKit
        if: matrix.shard == 'general'
        env:
          DEST: ${{ steps.simulator.outputs.destination }}
        run: |
          mkdir -p build
          xcodebuild test-without-building -project Shekati.xcodeproj -scheme Shekati -destination "$DEST" \
            -derivedDataPath DerivedData -resultBundlePath build/Financial.xcresult \
            -only-testing:ShekatiTests -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO
      - name: Summarize hosted unit tests
        if: always() && matrix.shard == 'general' && steps.compile.outcome == 'success'
        run: |
          if [ -d build/Financial.xcresult ]; then
            xcrun xcresulttool get test-results summary --path build/Financial.xcresult | tee build/unit-summary.json
          fi
      - name: Save hosted unit test results
        if: always() && matrix.shard == 'general'
        uses: actions/upload-artifact@v4
        with:
          name: Shekati-finance-migration-storekit
          path: |
            build/Financial.xcresult
            build/unit-summary.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Run iPhone interaction tests
        timeout-minutes: 80
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        env:
          DEST: ${{ steps.simulator.outputs.destination }}
          SHARD: ${{ matrix.shard }}
        run: |
          mkdir -p build
          # Specialized flows have their own simulator. The general shard picks up future UI classes.
          if [[ "$SHARD" == "ledger" ]]; then
            selectors=(-only-testing:ShekatiUITests/LedgerToolsUITests)
          elif [[ "$SHARD" == "capture" ]]; then
            selectors=(-only-testing:ShekatiUITests/StoreScreenshotUITests/testArabicLargeTextOCRFooterInPortraitAndLandscape)
          else
            selectors=(-only-testing:ShekatiUITests
                       -skip-testing:ShekatiUITests/ResponsiveLayoutUITests
                       -skip-testing:ShekatiUITests/StoreScreenshotUITests
                       -skip-testing:ShekatiUITests/LedgerToolsUITests)
          fi
          xcodebuild test-without-building -project Shekati.xcodeproj -scheme Shekati -destination "$DEST" \
            -derivedDataPath DerivedData -resultBundlePath build/Shekati.xcresult \
            "${selectors[@]}" -parallel-testing-enabled NO \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 1500 \
            -maximum-test-execution-time-allowance 1800 \
            CODE_SIGNING_ALLOWED=NO
      - name: Export native UI attachments
        if: always()
        run: |
          if [ -d build/Shekati.xcresult ]; then
            xcrun xcresulttool export attachments --path build/Shekati.xcresult --output-path build/ui-attachments
          fi
      - name: Save native UI attachments
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Shekati-native-ui-attachments${{ matrix.artifactSuffix }}
          path: build/ui-attachments
          if-no-files-found: ignore
          retention-days: 14
      - name: Save simulator test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Shekati-simulator-test-report${{ matrix.artifactSuffix }}
          path: build/Shekati.xcresult
          if-no-files-found: ignore
          retention-days: 14
