name: Shekati
options:
  minimumXcodeGenVersion: "2.42.0"
  projectFormat: xcode16_0
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
packages:
  ShekatiCore:
    path: Packages/ShekatiCore
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SHEKATI_ICLOUD_CONTAINER: iCloud.com.mf103871.shekati
  configs:
    Debug:
      SHEKATI_APS_ENVIRONMENT: development
    Release:
      SHEKATI_APS_ENVIRONMENT: production
targets:
  Shekati:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Shekati
        excludes:
          - Resources
      - path: Shekati/Resources
        excludes:
          - Info.plist
          - Shekati.entitlements
    dependencies:
      - package: ShekatiCore
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_BUNDLE_IDENTIFIER: com.mf103871.shekati
        PRODUCT_NAME: Shekati
        INFOPLIST_FILE: Shekati/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Shekati/Resources/Shekati.entitlements
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
  ShekatiTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ShekatiTests
    dependencies:
      - target: Shekati
      - package: ShekatiCore
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_BUNDLE_IDENTIFIER: com.mf103871.shekati.tests
        GENERATE_INFOPLIST_FILE: YES
  ShekatiUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ShekatiUITests
    dependencies:
      - target: Shekati
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_BUNDLE_IDENTIFIER: com.mf103871.shekati.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Shekati:
    build:
      targets:
        Shekati: all
        ShekatiTests: [test]
        ShekatiUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - name: ShekatiTests
        - name: ShekatiUITests
        - package: ShekatiCore/ShekatiCoreTests
    archive:
      config: Release
    management:
      shared: true
