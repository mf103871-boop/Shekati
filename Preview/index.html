};
function t(key){return words[key][lang==='ar'?0:1];}
function esc(v){return String(v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function money(v){return new Intl.NumberFormat(lang==='ar'?'ar':'en-US',{minimumFractionDigits:2,maximumFractionDigits:2}).format(v);}
function date(v){return new Intl.DateTimeFormat(lang==='ar'?'ar':'en',{day:'numeric',month:'short'}).format(new Date(v+'T12:00:00'));}
function unresolved(r){return r.status==='pending'||r.status==='returned';}
function rowHTML(r){var name=lang==='ar'?r.party:r.partyEn;var bank=lang==='ar'?r.bank:r.bankEn;var status=unresolved(r)&&r.date<day(0)?'overdue':r.status;
return '<button class="cheque" data-detail="'+r.id+'"><span class="symbol">'+(r.direction==='incoming'?'↙':'↗')+'</span><span class="details"><h4>'+esc(name||r.number||t(r.direction))+'</h4><span class="meta">'+esc(bank)+' · '+esc(r.number)+' · '+date(r.date)+'</span></span><span class="money" dir="ltr">'+money(r.amount)+'<br><span class="badge '+status+'">'+t(status)+'</span></span></button>';}
function visible(){return rows.filter(function(r){if(filter==='incoming'||filter==='outgoing'){if(r.direction!==filter)return false;}else if(filter==='today'){if(!unresolved(r)||r.date!==day(0))return false;}else if(filter==='week'){if(!unresolved(r)||r.date<day(0)||r.date>day(7))return false;}else if(filter==='overdue'){if(!unresolved(r)||r.date>=day(0))return false;}
return [r.number,r.party,r.partyEn,r.bank,r.bankEn].join(' ').toLowerCase().includes(query.toLowerCase());}).sort(function(a,b){if(sort==='amount')return b.amount-a.amount;if(sort==='name')return (lang==='ar'?a.party:a.partyEn).localeCompare(lang==='ar'?b.party:b.partyEn);return a.date.localeCompare(b.date);});}
function renderHome(){
var active=rows.filter(unresolved),incoming=active.filter(function(r){return r.direction==='incoming';}).reduce(function(s,r){return s+r.amount;},0),outgoing=active.filter(function(r){return r.direction==='outgoing';}).reduce(function(s,r){return s+r.amount;},0);
var html='<div class="greeting">'+t('greeting')+'</div><p class="subtitle">'+t('subtitle')+'</p><div class="hero"><div class="label">'+t('outstanding')+'</div><div class="total"><small>USD</small>'+money(incoming+outgoing)+'</div><div class="footer"><span>◉ '+t('reminders')+'</span><span>'+active.length+' '+t('active')+'</span></div></div><div class="totals"><button class="totalcard" data-filter="incoming"><div class="arrow">↙</div><span>'+t('collect')+'</span><strong>'+money(incoming)+'</strong></button><button class="totalcard" data-filter="outgoing"><div class="arrow">↗</div><span>'+t('pay')+'</span><strong>'+money(outgoing)+'</strong></button></div><div class="periods">';
[['today','dueToday','▣'],['week','week','◷'],['overdue','overdue','!']].forEach(function(a){var count=active.filter(function(r){return a[0]==='today'?r.date===day(0):a[0]==='week'?r.date>=day(0)&&r.date<=day(7):r.date<day(0);}).length;html+='<button class="period" data-filter="'+a[0]+'"><span class="symbol">'+a[2]+'</span><span class="name">'+t(a[1])+'</span><span class="count">'+count+'</span><span class="chevron">'+(lang==='ar'?'‹':'›')+'</span></button>';});
html+='</div><div class="sectionhead"><h3>'+t('next')+'</h3><button class="textbutton" data-filter="all">'+t('all')+'</button></div>';
active.sort(function(a,b){return a.date.localeCompare(b.date);}).slice(0,3).forEach(function(r){html+=rowHTML(r);});return html;

document.getElementById('introTitle').innerHTML=lang==='ar'?'كل شيك.<br>في وقته.':'Every cheque.<br>In its time.';
document.getElementById('introText').textContent=lang==='ar'?'تفاصيل واضحة، مواعيد مرتّبة، وتنبيهات تساعدك تتابع التزاماتك بثقة.':'Clear details, organised dates and reminders that help you stay on top of every commitment.';
document.getElementById('previewLabel').textContent=lang==='ar'?'معاينة تفاعلية · بيانات تجريبية':'Interactive design preview · sample data';
document.getElementById('previewNote').textContent=lang==='ar'?'هذه معاينة التصميم. الكاميرا، إشعارات iOS ومزامنة iCloud موجودة في مشروع تطبيق الآيفون وتحتاج اختبارًا على جهاز فعلي.':'This is a design preview. Camera, iOS notifications and iCloud sync are in the native iPhone project and require device testing.';
}
function closeModal(){document.getElementById('modalHost').innerHTML='';}
function modal(content){document.getElementById('modalHost').innerHTML='<div class="modalBackdrop"><section class="modal" role="dialog" aria-modal="true">'+content+'</section></div>';var input=document.querySelector('.modal input');if(input)input.focus();}
function addForm(){
modal('<div class="modalhead"><h3>'+t('add')+'</h3><button data-close>'+t('cancel')+'</button></div><form id="chequeForm"><label class="field">'+t('direction')+'<select name="direction"><option value="outgoing">'+t('outgoing')+'</option><option value="incoming">'+t('incoming')+'</option></select></label><div class="pair"><label class="field">'+t('amount')+'<input name="amount" inputmode="decimal" placeholder="0.00" required></label><label class="field">'+t('number')+'<input name="number" placeholder="000000"></label></div><label class="field">'+t('date')+'<input name="date" type="date" value="'+day(1)+'" required></label><label class="field">'+t('party')+'<input name="party"></label><label class="field">'+t('bank')+'<input name="bank"></label><div id="formError" role="alert" class="note"></div><button class="primary" type="submit">'+t('save')+'</button></form>');
document.getElementById('chequeForm').onsubmit=function(e){e.preventDefault();var f=new FormData(e.target);var amount=Number(String(f.get('amount')).replace(',','.'));var dateValue=String(f.get('date'));if(!(amount>0)||!Number.isFinite(amount)||!/^\d{4}-\d{2}-\d{2}$/.test(dateValue)){document.getElementById('formError').textContent=t('error');return;}
rows.push({id:Math.max.apply(null,rows.map(function(r){return r.id;}))+1,number:String(f.get('number')),party:String(f.get('party')),partyEn:String(f.get('party')),bank:String(f.get('bank')),bankEn:String(f.get('bank')),amount:Math.round(amount*100)/100,date:dateValue,direction:String(f.get('direction')),status:'pending'});closeModal();filter='all';tab='cheques';query='';render();};
}
function details(id){var r=rows.find(function(a){return a.id===id;});if(!r)return;var html='<div class="modalhead"><h3>'+t('detail')+'</h3><button data-close>'+t('cancel')+'</button></div>';
[[t('party'),lang==='ar'?r.party:r.partyEn],[t('number'),r.number],[t('amount'),money(r.amount)+' USD'],[t('date'),date(r.date)],[t('bank'),lang==='ar'?r.bank:r.bankEn],[t('direction'),t(r.direction)],[t('pending'),t(r.status)]].forEach(function(a){html+='<div class="detailrow"><span>'+a[0]+'</span><strong>'+esc(a[1])+'</strong></div>';});
if(unresolved(r))html+='<label class="field">'+t('actual')+'<input id="actualDate" type="date" value="'+day(0)+'"></label><button class="primary" data-settle="'+r.id+'">'+t('paid')+'</button>';
html+='<button class="secondary" data-remove="'+r.id+'">'+t('remove')+'</button>';modal(html);}
document.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;
if(b.id==='language'||b.id==='settingsLanguage'){lang=lang==='ar'?'en':'ar';render();}
else if(b.id==='theme'){dark=!dark;render();}
else if(b.id==='add')addForm();
else if(b.dataset.tab){tab=b.dataset.tab;render();}
else if(b.dataset.filter){filter=b.dataset.filter;tab='cheques';query='';render();}
else if(b.dataset.detail)details(Number(b.dataset.detail));
else if(b.hasAttribute('data-close'))closeModal();
else if(b.dataset.settle){var r=rows.find(function(a){return a.id===Number(b.dataset.settle);});var input=document.getElementById('actualDate');if(r&&input.value){r.status='settled';r.actualDate=input.value;closeModal();render();}}
else if(b.dataset.remove){var r=rows.find(function(a){return a.id===Number(b.dataset.remove);});if(r){modal('<h3>'+t('remove')+'؟</h3><button class="primary" data-confirm-remove="'+r.id+'">'+t('remove')+'</button><button class="secondary" data-close>'+t('cancel')+'</button>');}}
else if(b.dataset.confirmRemove){rows=rows.filter(function(r){return r.id!==Number(b.dataset.confirmRemove);});closeModal();render();}
else if(b.id==='summarySwitch'){summary=!summary;render();}
else if(b.id==='detailsSwitch'){notificationDetails=!notificationDetails;render();}
});
document.addEventListener('input',function(e){if(e.target.id==='search'){query=e.target.value;document.getElementById('results').innerHTML=listRows();}});
document.addEventListener('change',function(e){if(e.target.id==='sort'){sort=e.target.value;document.getElementById('results').innerHTML=listRows();}});
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeModal();});
render();
})();
</script>
</body></html>
